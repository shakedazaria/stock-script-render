name: Backtest (manual)
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, comma separated (leave EMPTY to sample from the scanner universe)"
        default: ""
      sample:
        description: "How many random tickers from scanner_state/universe_cache.json"
        default: "150"
      seed:
        description: "Random seed (same seed = same tickers)"
        default: "1"
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2023-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        default: "2026-09-30"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run backtest
        env:
          TICKERS: ${{ inputs.tickers }}
          SAMPLE: ${{ inputs.sample }}
          SEED: ${{ inputs.seed }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -o pipefail
          ls -la scanner_state | head -20
          python scanner_backtest.py --scanner stock_scanner_unified.py --tickers "$TICKERS" --universe-cache scanner_state/universe_cache.json --sample "$SAMPLE" --seed "$SEED" --start "$START" --end "$END" --out bt_results.csv 2>&1 | tee bt_summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backtest-results
          path: |
            bt_results.csv
            bt_summary.txt
          retention-days: 7
