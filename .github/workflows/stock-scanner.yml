name: Stock Scanner Daily

on:
  schedule:
    # ניסיונות כל 15 דקות בערך בין 05:00 ל-09:59 לפי שעון ישראל.
    # אין הגבלת ימים: ה-Python עצמו מחליט לפי נר השוק אם יש צורך ב-Full Scan.
    - cron: "7,22,37,52 5-9 * * *"
      timezone: "Asia/Jerusalem"

  # הפעלה ידנית תמיד אפשרית
  workflow_dispatch:

concurrency:
  group: stock-scanner-daily
  cancel-in-progress: false

jobs:
  run-stock-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      TWELVEDATA_API_KEYS: ${{ secrets.TWELVEDATA_API_KEYS }}
      TO_EMAILS: ${{ secrets.TO_EMAILS }}

      STATE_DIR: "scanner_state"

      PREFILTER_BATCH_SIZE: "50"
      PREFILTER_DOWNLOAD_RETRIES: "3"
      PREFILTER_TIMEOUT_SECONDS: "20"
      PREFILTER_RETRY_SLEEP_SECONDS: "10"
      SCAN_DELAY_SECONDS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # אין כאן בדיקת יום בשבוע ואין בדיקת שעה בפועל.
      # גם אם GitHub מפעיל Run מתוזמן באיחור, הוא עדיין רשאי לנסות.
      # רק Full Scan מוצלחת שכבר בוצעה היום חוסמת Full Scan נוספת.
      - name: Check daily full scan status
        id: dailycheck
        shell: bash
        run: |
          mkdir -p scanner_state

          ISRAEL_DATE=$(TZ="Asia/Jerusalem" date +%F)
          ISRAEL_TIME=$(TZ="Asia/Jerusalem" date +%H:%M)
          MARKER_FILE="scanner_state/last_successful_full_scan_date.txt"

          echo "============================================================"
          echo "Israel date: $ISRAEL_DATE"
          echo "Israel time: $ISRAEL_TIME"
          echo "Event: ${{ github.event_name }}"
          echo "============================================================"

          # Manual run תמיד עוקף את הנעילה היומית.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing daily Full Scan lock."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SUCCESS=""
          if [ -f "$MARKER_FILE" ]; then
            LAST_SUCCESS=$(tr -d '\r\n ' < "$MARKER_FILE")
          fi

          echo "Last successful Full Scan: ${LAST_SUCCESS:-NONE}"
          echo "Today: $ISRAEL_DATE"

          if [ "$LAST_SUCCESS" = "$ISRAEL_DATE" ]; then
            echo "Full Scan already completed successfully today."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Full Scan today — Python may run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dailycheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.dailycheck.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make sure state folder exists
        if: steps.dailycheck.outputs.should_run == 'true'
        run: mkdir -p scanner_state

      - name: Run stock scanner
        id: scanner
        if: steps.dailycheck.outputs.should_run == 'true'
        shell: bash
        run: |
          set +e

          python stock_scanner_unified.py 2>&1 | tee current_scanner_run.log
          PYTHON_EXIT=${PIPESTATUS[0]}

          set -e

          echo "Python exit code: $PYTHON_EXIT"

          if [ "$PYTHON_EXIT" -ne 0 ]; then
            echo "Scanner failed."
            echo "full_scan_success=false" >> "$GITHUB_OUTPUT"
            exit "$PYTHON_EXIT"
          fi

          # Exit code 0 אינו מספיק: Market Day Guard יכול לדלג בלי Full Scan.
          # רק DONE מסמן שהסריקה המלאה באמת הסתיימה.
          if grep -Eq "Stock Scanner Unified.*DONE" current_scanner_run.log; then
            echo "FULL SCAN COMPLETED SUCCESSFULLY"
            echo "full_scan_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Python finished without Full Scan completion."
            echo "Market Day Guard probably found no new/changed market candle."
            echo "The next scheduled attempt remains allowed."
            echo "full_scan_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark successful full scan
        if: >
          steps.dailycheck.outputs.should_run == 'true' &&
          steps.scanner.outputs.full_scan_success == 'true'
        shell: bash
        run: |
          mkdir -p scanner_state
          ISRAEL_DATE=$(TZ="Asia/Jerusalem" date +%F)
          echo "$ISRAEL_DATE" > scanner_state/last_successful_full_scan_date.txt
          echo "Successful Full Scan locked for: $ISRAEL_DATE"

      - name: Remove temporary workflow log
        if: steps.dailycheck.outputs.should_run == 'true' && always()
        run: rm -f current_scanner_run.log

      - name: Commit scanner state to repository
        if: steps.dailycheck.outputs.should_run == 'true' && always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p scanner_state
          git add scanner_state/

          if git diff --cached --quiet; then
            echo "No scanner state changes."
          else
            git commit -m "Update scanner state"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload scanner state artifact
        if: steps.dailycheck.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ github.run_id }}
          path: scanner_state
          retention-days: 30

      - name: Scanner already completed today
        if: steps.dailycheck.outputs.should_run == 'false'
        run: |
          echo "Full Scan already completed successfully today."
          echo "No Python execution required."
