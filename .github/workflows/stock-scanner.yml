name: Stock Scanner Daily

on:
  schedule:
    # התזמון נשאר כפי שהיה. החסימה לפי היום והשעה נבדקת לפני checkout.
    - cron: "7,22,37,52 5-9 * * *"
      timezone: "Asia/Jerusalem"

  workflow_dispatch:

concurrency:
  group: stock-scanner-daily
  cancel-in-progress: false

jobs:
  run-stock-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      TWELVEDATA_API_KEYS: ${{ secrets.TWELVEDATA_API_KEYS }}
      TO_EMAILS: ${{ secrets.TO_EMAILS }}

      STATE_DIR: "scanner_state"

      PREFILTER_BATCH_SIZE: "50"
      PREFILTER_DOWNLOAD_RETRIES: "3"
      PREFILTER_TIMEOUT_SECONDS: "20"
      PREFILTER_RETRY_SLEEP_SECONDS: "10"
      SCAN_DELAY_SECONDS: "3"

    steps:
      - name: Check Israel calendar before any scanner work
        id: calendar
        shell: bash
        run: |
          # העזר נכתב לתיקייה הזמנית של ה-runner, ואינו משנה את קוד הסורק.
          # הוא משותף לבדיקה הראשונה ולבדיקה החוזרת ממש לפני הפעלת Python.
          cat > "$RUNNER_TEMP/scanner-calendar.sh" <<'BASH'
          scanner_calendar_check() {
            CALENDAR_ALLOWED=false
            CALENDAR_REASON="Calendar unavailable — scanner blocked."
            CALENDAR_RUN_SECONDS=0
            CALENDAR_LIMITED=false
            CALENDAR_STOP_EPOCH=0

            if [[ ! -r /usr/share/zoneinfo/Asia/Jerusalem ]]; then
              return 1
            fi
            local now_epoch snapshot weekday hour tomorrow boundary remaining
            if ! now_epoch=$(date +%s); then return 1; fi
            if ! snapshot=$(TZ=Asia/Jerusalem date -d "@$now_epoch" '+%F %T %u %H'); then
              return 1
            fi
            read -r CALENDAR_DATE CALENDAR_TIME weekday hour <<< "$snapshot"
            if [[ ! "$weekday" =~ ^[1-7]$ || ! "$hour" =~ ^[0-9]{2}$ ]]; then
              return 1
            fi

            # יום שבת כולו חסום. ביום שישי החסימה מסתיימת ב-16:00 בדיוק.
            if [[ "$weekday" == 6 ]]; then
              CALENDAR_REASON="Saturday in Israel — scanner blocked."
              return 1
            fi
            if [[ "$weekday" == 5 ]] && (( 10#$hour < 16 )); then
              CALENDAR_REASON="Friday before 16:00 in Israel — scanner blocked."
              return 1
            fi

            CALENDAR_RUN_SECONDS=21600
            # הגנה גם על ריצה ידנית או מאוחרת שחוצה אל פרק הזמן החסום.
            # ביום חמישי הגבול הוא שישי 00:00; בשישי הוא שבת 00:00.
            if [[ "$weekday" == 4 || "$weekday" == 5 ]]; then
              if ! tomorrow=$(TZ=Asia/Jerusalem date -d "$CALENDAR_DATE +1 day" +%F); then
                return 1
              fi
              if ! boundary=$(TZ=Asia/Jerusalem date -d "$tomorrow 00:00:00" +%s); then
                return 1
              fi
              # השארת מרווח ל-TERM ואחריו KILL לפני תחילת הזמן החסום.
              remaining=$((boundary - now_epoch - 10))
              if (( remaining <= 0 )); then
                CALENDAR_REASON="Blocked period is about to start — scanner blocked."
                return 1
              fi
              if (( remaining < CALENDAR_RUN_SECONDS )); then
                CALENDAR_RUN_SECONDS=$remaining
                CALENDAR_LIMITED=true
                CALENDAR_STOP_EPOCH=$((now_epoch + remaining))
              fi
            fi
            CALENDAR_ALLOWED=true
            CALENDAR_REASON="Calendar permits scanner execution."
            return 0
          }
          BASH

          source "$RUNNER_TEMP/scanner-calendar.sh"
          if scanner_calendar_check; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Israel: ${CALENDAR_DATE:-UNKNOWN} ${CALENDAR_TIME:-UNKNOWN}"
          echo "$CALENDAR_REASON"

      - name: Checkout repository
        if: steps.calendar.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check daily full scan status
        id: dailycheck
        if: steps.calendar.outputs.allowed == 'true'
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          mkdir -p scanner_state
          ISRAEL_DATE=$(TZ="Asia/Jerusalem" date +%F)
          MARKER_FILE="scanner_state/last_successful_full_scan_date.txt"

          # ידני עוקף רק את הנעילה היומית. הוא אינו עוקף את חסימת הזמן.
          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing daily Full Scan lock. Calendar rules still apply."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SUCCESS=""
          if [ -f "$MARKER_FILE" ]; then
            LAST_SUCCESS=$(tr -d '\r\n ' < "$MARKER_FILE")
          fi
          echo "Last successful Full Scan: ${LAST_SUCCESS:-NONE}"
          echo "Today: $ISRAEL_DATE"

          if [ "$LAST_SUCCESS" = "$ISRAEL_DATE" ]; then
            echo "Full Scan already completed successfully today."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Full Scan today — Python may run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dailycheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.dailycheck.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock scanner
        id: scanner
        if: steps.dailycheck.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "full_scan_success=false" >> "$GITHUB_OUTPUT"
          echo "execution_started=false" >> "$GITHUB_OUTPUT"

          # בדיקה חוזרת לפי השעה בפועל, גם אם ההכנות או התור ארכו זמן.
          source "$RUNNER_TEMP/scanner-calendar.sh"
          if ! scanner_calendar_check; then
            echo "$CALENDAR_REASON"
            exit 0
          fi

          echo "execution_started=true" >> "$GITHUB_OUTPUT"
          echo "Israel: $CALENDAR_DATE $CALENDAR_TIME"
          echo "Maximum scanner runtime for this attempt: $CALENDAR_RUN_SECONDS seconds"
          SCANNER_LOG="$RUNNER_TEMP/current_scanner_run.log"

          set +e
          timeout --signal=TERM --kill-after=5s "${CALENDAR_RUN_SECONDS}s" \
            python stock_scanner_unified.py 2>&1 | tee "$SCANNER_LOG"
          RUN_RESULTS=("${PIPESTATUS[@]}")
          set -e

          PYTHON_EXIT=${RUN_RESULTS[0]}
          TEE_EXIT=${RUN_RESULTS[1]}
          echo "Scanner process exit code: $PYTHON_EXIT"

          if [ "$TEE_EXIT" -ne 0 ]; then
            echo "Unable to capture scanner completion reliably. No daily lock created."
            exit "$TEE_EXIT"
          fi

          if [[ "$CALENDAR_LIMITED" == true ]] &&
             (( PYTHON_EXIT == 124 || PYTHON_EXIT == 137 )) &&
             (( $(date +%s) >= CALENDAR_STOP_EPOCH )); then
            echo "Scanner stopped before the blocked Israel calendar period."
            echo "No successful Full Scan lock created."
            exit 0
          fi

          if [ "$PYTHON_EXIT" -ne 0 ]; then
            echo "Scanner failed. No successful Full Scan lock created."
            exit "$PYTHON_EXIT"
          fi

          # Exit code 0 לבדו אינו מספיק: דילוג אינו Full Scan מוצלחת.
          if grep -Eq 'Stock Scanner Unified.*DONE' "$SCANNER_LOG"; then
            echo "FULL SCAN COMPLETED SUCCESSFULLY"
            echo "full_scan_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Python finished without Full Scan completion."
            echo "The next allowed scheduled attempt remains permitted."
          fi

      - name: Mark successful full scan
        if: steps.scanner.outputs.full_scan_success == 'true'
        shell: bash
        run: |
          mkdir -p scanner_state
          ISRAEL_DATE=$(TZ="Asia/Jerusalem" date +%F)
          echo "$ISRAEL_DATE" > scanner_state/last_successful_full_scan_date.txt
          echo "Successful Full Scan locked for: $ISRAEL_DATE"

      - name: Remove temporary workflow log
        if: always() && steps.scanner.outputs.execution_started == 'true'
        run: rm -f "$RUNNER_TEMP/current_scanner_run.log"

      - name: Commit scanner state to repository
        if: always() && steps.scanner.outputs.execution_started == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scanner_state
          git add scanner_state/

          if git diff --cached --quiet; then
            echo "No scanner state changes."
          else
            git commit -m "Update scanner state"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload scanner state artifact
        if: always() && steps.scanner.outputs.execution_started == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ github.run_id }}
          path: scanner_state
          retention-days: 30

      - name: Scanner blocked by Israel calendar
        if: steps.calendar.outputs.allowed == 'false'
        run: echo "Scanner skipped before checkout and Python setup — Israel calendar block."

      - name: Scanner already completed today
        if: steps.dailycheck.outputs.should_run == 'false'
        run: echo "Full Scan already completed successfully today. No Python execution required."
