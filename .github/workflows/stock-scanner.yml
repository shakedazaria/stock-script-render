name: Stock Scanner Daily

on:
  schedule:
    # שלושה ניסיונות ביום, בכל יום בשבוע, לפי שעון ישראל.
    # ה-Python עצמו מחליט באמצעות Market Day Guard
    # האם יש מידע חדש שמצדיק Full Scan.
    - cron: "37 6,7,8 * * *"
      timezone: "Asia/Jerusalem"

  # מאפשר גם הפעלה ידנית מ-GitHub Actions
  workflow_dispatch:

concurrency:
  group: stock-scanner-daily
  cancel-in-progress: false

jobs:
  run-stock-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      TWELVEDATA_API_KEYS: ${{ secrets.TWELVEDATA_API_KEYS }}
      TO_EMAILS: ${{ secrets.TO_EMAILS }}

      # תיקיית הזיכרון של הסורק
      STATE_DIR: "scanner_state"

      # הגדרות יציבות
      PREFILTER_BATCH_SIZE: "50"
      PREFILTER_DOWNLOAD_RETRIES: "3"
      PREFILTER_TIMEOUT_SECONDS: "20"
      PREFILTER_RETRY_SLEEP_SECONDS: "10"
      SCAN_DELAY_SECONDS: "3"

    steps:

      # ============================================================
      # 1. הורדת הקוד
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ============================================================
      # 2. שחזור הזיכרון האחרון של הסורק
      # ============================================================
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: scanner_state
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      # ============================================================
      # 3. Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ============================================================
      # 4. התקנת הספריות
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 5. וידוא שתיקיית ה-State קיימת
      # ============================================================
      - name: Make sure state folder exists
        run: mkdir -p scanner_state

      # ============================================================
      # 6. הצגת זמן ישראל לצורך הלוג
      # ============================================================
      - name: Show Israel time
        run: |
          echo "=========================================="
          echo "GitHub triggered the stock scanner"
          echo "Israel time:"
          TZ="Asia/Jerusalem" date
          echo "=========================================="

      # ============================================================
      # 7. הפעלת הסורק
      #
      # אין כאן יותר בדיקת שעה או last_run_date.
      #
      # Market Day Guard שבתוך stock_scanner_unified.py
      # הוא היחיד שמחליט:
      #
      # נר חדש             -> Full Scan
      # אותו נר השתנה      -> Full Scan
      # אותו נר ללא שינוי  -> Exit מהיר
      # שבת / ראשון / חג   -> Exit מהיר אם אין מידע חדש
      # ============================================================
      - name: Run stock scanner
        run: python stock_scanner_unified.py

      # ============================================================
      # 8. שמירת State ב-GitHub Repository
      # ============================================================
      - name: Commit scanner state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p scanner_state
          git add scanner_state/

          if git diff --cached --quiet; then
            echo "No scanner state changes"
          else
            git commit -m "Update scanner state"

            echo "Syncing with remote repository..."
            git pull --rebase

            echo "Pushing scanner state..."
            git push
          fi

      # ============================================================
      # 9. שמירת State גם ב-Cache
      # ============================================================
      - name: Save scanner state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state
          key: scanner-state-${{ github.run_id }}

      # ============================================================
      # 10. גיבוי נוסף כ-Artifact
      # ============================================================
      - name: Upload scanner state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state
          path: scanner_state
          retention-days: 90
